# Publicação do app de treino na Netlify.
#
# Não há etapa de build: a pasta concurso-datalake/site é gerada localmente por
#   python scripts/build_site.py
# e vai versionada no repositório. Assim o deploy não depende de Python nem do
# SQLite no ambiente da Netlify.

[build]
  publish = "concurso-datalake/site"
  command = ""

# A proteção por usuário e senha é a edge function netlify/edge-functions/auth.ts,
# que se declara sozinha (export const config) e cobre "/*" — inclusive
# dados/questoes.json e os recortes de PDF. As credenciais ficam nas variáveis
# de ambiente SITE_USER e SITE_PASS do painel da Netlify, nunca neste arquivo.

# O conteúdo é de provas das bancas: fora dos buscadores.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"

# index.html e o service worker precisam ser revalidados para o deploy novo
# chegar ao celular; quem controla o cache offline é o próprio service worker.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/dados/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# recortes de PDF nunca mudam de conteúdo sob o mesmo nome
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
